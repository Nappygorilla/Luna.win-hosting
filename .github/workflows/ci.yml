name: Luna API CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package.json
      - run: npm install
      - run: node --check src/server.mjs
      - run: node --check src/server.mjs
      - run: node --check src/agent-runner.mjs
      - run: node --check src/agent.mjs
      - run: node --check src/billing.mjs
      - run: node --check src/mailer.mjs
      - run: npm test
